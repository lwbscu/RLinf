  defaults:
    - model/lingbotvla@actor.model
    - hybrid_engines/fsdp@actor.fsdp_config
    - override hydra/job_logging: stdout

  hydra:
    run:
      dir: .
    output_subdir: null
    searchpath:
      - file://${oc.env:EMBODIED_PATH}/config/

  cluster:
    num_nodes: 1
    component_placement:
      actor: 0-7

  runner:
    task_type: sft
    logger:
      log_path: "../results"
      project_name: rlinf
      experiment_name: "robotwin_sft_lingbotvla"
      logger_backends: ["tensorboard"]  # wandb, swanlab

    max_steps: 30000
    val_check_interval: -1
    save_interval: 1000
    post_save_eval:
      enabled: False
      command: null
      fail_on_error: True
      offload_actor: True

  data:
    train_data_paths: "/path/to/robotwin-data"

  actor:
    group_name: "ActorGroup"
    training_backend: "fsdp"
    micro_batch_size: 1
    global_batch_size: 8
    seed: 0

    model:
      lingbotvla:
        config_path: "/path/to/lingbot-vla-4b"

    optim:
      lr: 2.5e-5
      adam_beta1: 0.9
      adam_beta2: 0.95
      adam_eps: 1.0e-08
      weight_decay: 1e-4
      clip_grad: 1.0
      total_training_steps: ${runner.max_steps}
      lr_warmup_steps: 1000
      lr_scheduler: "cosine"
      num_cycles: 0.5
      min_lr: 2.5e-6

    fsdp_config:
      sharding_strategy: "no_shard"
      mixed_precision:
        param_dtype: ${actor.model.precision}
        reduce_dtype: ${actor.model.precision}
        buffer_dtype: ${actor.model.precision}
