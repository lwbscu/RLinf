model_type: "lingbotvla"

# Model paths - should be overridden in specific experiment configs or via CLI
model_path: "/path/to/model/lingbot-vla-4b"
tokenizer_path: "/path/to/model/Qwen2.5-VL-3B-Instruct"

precision: "bf16"

# Action and chunk settings
num_action_chunks: 50
action_dim: 14
action_env_dim: 14
sft_action_loss_dim: 16
max_action_dim: 75
max_state_dim: 75

# LoRA settings
is_lora: False
lora_rank: 4

# Training settings
use_proprio: True
proprio_dim: 14
num_steps: 10
add_value_head: False
value_type: "action_level"
sft_trainable_scope: "all"

# Lingbotvla specific parameters 
lingbotvla:
  config_path: "${oc.env:LINGBOT_VLA_PATH}/lingbot-vla-4b"
  stats_path: "${oc.env:LINGBOT_VLA_PATH}/assets/norm_stats/robotwin_all_new.json"
  data_type: "robotwin_rep"
  max_prompt_length: 512
  noise_level: 0.5
  noise_method: "flow_sde"
  joint_logprob: False
  
  # Interpolation pointers to global actor settings (Hydra magic)
  action_chunk: ${..num_action_chunks}
  action_env_dim: ${..action_env_dim}
  num_steps: ${..num_steps}
  add_value_head: ${..add_value_head}
